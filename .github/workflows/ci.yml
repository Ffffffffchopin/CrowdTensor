name: Training core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Remove packaging metadata before source checks
        run: rm -rf build crowdtensord.egg-info
      - run: python scripts/check_repository.py --json
      - run: python -m compileall -q crowdtensor tests
      - name: Framework-neutral contracts
        run: >-
          python -m pytest -q
          tests/test_repository_slimming.py
          tests/test_training_core_contracts.py
          tests/test_training_core_controller.py
          tests/test_training_core_execution.py
          tests/test_training_core_plugins.py
          tests/test_training_core_workspace.py
          tests/test_training_backend_registry.py
          tests/test_training_accelerate_backend.py
          tests/test_training_provider_adapters.py
          tests/test_capability_adapter.py
          tests/test_model_manifests.py
      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: python -m build --wheel --no-isolation

  optional-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          'torch>=2,<3'
      - run: python -m pip install -e '.[dev,hf,storage]'
      - name: Remove packaging metadata before source checks
        run: rm -rf build crowdtensord.egg-info
      - run: python -m pytest -q
