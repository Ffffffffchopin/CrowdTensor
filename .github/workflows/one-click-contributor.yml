name: One-Click Contributor RC

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,browser,hf,storage]'
      - run: python -m playwright install --with-deps chromium
      - name: One-click protocol and UI tests
        run: >-
          python -m pytest -q
          tests/test_one_click_contributor.py
          tests/test_volunteer_training_api.py
          tests/test_volunteer_training_cli.py
          tests/test_volunteer_training_operator_beta.py
      - name: Browser plus native Agent E2E
        run: >-
          python scripts/one_click_contributor_e2e.py
          --output-dir dist/one-click-e2e --json
      - name: Build wheel, sdist, SBOM, and container proof
        run: >-
          python scripts/community_release_build.py
          --output-dir dist/community-release
          --build-container --json
      - name: Pack One-Click Contributor release
        run: >-
          python scripts/one_click_contributor_release_pack.py
          --community-report dist/community-release/community_release_build.json
          --e2e-report dist/one-click-e2e/one_click_contributor_e2e.json
          --output-dir dist/one-click-release --json
      - name: Strict release check
        run: >-
          python scripts/one_click_contributor_release_check.py
          --report dist/one-click-release/one_click_contributor_release_rc.json
          --require-ready --json
      - uses: actions/upload-artifact@v4
        with:
          name: one-click-contributor-${{ github.sha }}
          path: dist/one-click-release
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/one-click-release/crowdtensord-0.2.0rc6-py3-none-any.whl
          dist/one-click-release/crowdtensord-0.2.0rc6.tar.gz
          dist/one-click-release/install-contributor.sh
          dist/one-click-release/SHA256SUMS
          dist/one-click-release/release.json
          dist/one-click-release/crowdtensord-0.2.0rc6-one-click-contributor-beta.tar.gz
          --title "CrowdTensor 0.2.0rc6 - One-Click Contributor Beta"
          --notes-file docs/releases/one-click-contributor-beta-rc6.md
          --prerelease
