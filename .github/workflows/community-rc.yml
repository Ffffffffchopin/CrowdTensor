name: Community RC

on:
  push:
    paths:
      - "crowdtensor/**"
      - "scripts/community_*"
      - "tests/test_community*"
      - "docs/**"
      - "requirements/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/community-rc.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cpu-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,storage]'
      - name: Community protocol/runtime/CLI/privacy
        run: >-
          python -m pytest -q
          tests/test_community_protocol.py
          tests/test_community_workflow.py
          tests/test_community_api.py
          tests/test_community_security.py
          tests/test_community_reliability.py
          tests/test_community_live_training.py
          tests/test_community_cleanup_audit_check.py
          tests/test_community_maturity_rc.py
          tests/test_model_adapter.py
      - name: Existing scheduler and production regression
        run: >-
          python -m pytest -q
          tests/test_heterogeneous_training_scheduler.py
          tests/test_heterogeneous_training_production.py
      - name: Docs and templates
        run: python scripts/community_docs_check.py --json

  wheel-container-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Build, clean-install, SBOM, and local container
        run: >-
          python scripts/community_release_build.py
          --output-dir dist/community-release-ci
          --build-container --json
      - name: Strict release artifact check
        run: >-
          python scripts/community_release_check.py
          --report dist/community-release-ci/community_release_build.json --json
      - uses: actions/upload-artifact@v4
        with:
          name: community-release-${{ github.sha }}
          path: dist/community-release-ci

  optional-provider-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,tpu]'
      - name: CUDA contract tests without claiming CUDA hardware
        run: >-
          python -m pytest -q
          tests/test_heterogeneous_qwen_training.py
          tests/test_community_smollm_live_check.py
          tests/test_community_kaggle_reliability_live_check.py
      - name: JAX provider contract
        run: >-
          python -m pytest -q
          tests/test_heterogeneous_jax_qwen_training.py
          tests/test_heterogeneous_training_checkpoint.py
